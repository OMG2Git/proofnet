name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --all-packages
      - name: Pyodide parity runtime
        run: npm ci
        working-directory: packages/kernels/pyodide-parity
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy services/api packages/kernels workers/cli-worker
      - run: uv run pytest
      - name: OpenAPI export is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code apps/web/lib/api/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - name: Generated types are up to date
        run: git diff --exit-code lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
