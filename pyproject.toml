[project]
name = "proofnet-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.10", "mypy==2.4.0", "pytest==9.1.1", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "packages/kernels", "workers/cli-worker"]

[tool.uv.sources]
proofnet-api = { workspace = true }
proofnet-kernels = { workspace = true }
proofnet-cli-worker = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["proofnet_api", "proofnet_kernels", "cli_worker"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "services/api:packages/kernels:workers/cli-worker:packages/kernels/tests:services/api/tests"

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "packages/kernels/tests", "workers/cli-worker/tests"]
addopts = "-ra --import-mode=importlib"
pythonpath = ["packages/kernels/tests", "services/api/tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*", "joblib.*"]
ignore_missing_imports = true
