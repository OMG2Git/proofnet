[project]
name = "proofnet-api"
version = "0.1.0"
description = "ProofNet control plane (FastAPI)."
requires-python = ">=3.12,<3.15"
dependencies = [
  "proofnet-kernels",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "pymongo==4.18.2",
  "pyjwt==2.15.1",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.32",
  "pydantic-settings==2.15.0",
  "email-validator==2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proofnet_api"]
