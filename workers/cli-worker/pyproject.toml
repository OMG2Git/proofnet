[project]
name = "proofnet-cli-worker"
version = "0.1.0"
description = "CPython reference worker (dev, CI, simulation, fault injection)."
requires-python = ">=3.12,<3.15"
dependencies = ["proofnet-kernels", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli_worker"]
