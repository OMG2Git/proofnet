# Render Blueprint (free web service). Secrets are set in the Render dashboard, never committed.
services:
  - type: web
    name: proofnet-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install ./packages/kernels ./services/api
    startCommand: uvicorn proofnet_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: Project0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
