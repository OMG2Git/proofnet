[project]
name = "proofnet-kernels"
version = "0.1.0"
description = "ProofNet kernels. core/ = NumPy+stdlib only (runs on workers); server/ = backend only."
requires-python = ">=3.12,<3.15"
dependencies = ["numpy==2.4.6", "pydantic==2.13.5", "pandas==3.0.6", "scikit-learn==1.9.1", "joblib==1.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proofnet_kernels"]
